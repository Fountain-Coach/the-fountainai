<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FountainAI GUI</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; line-height: 1.4; }
      nav a { display: inline-block; margin: .25rem .5rem .25rem 0; padding: .25rem .5rem; border: 1px solid #ddd; border-radius: 4px; text-decoration: none; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
      .card { border: 1px solid #eee; border-radius: 8px; padding: 1rem; }
      code { background: #f6f8fa; padding: 0 .25rem; border-radius: 3px; }
      .ok { color: #0a0; }
      .bad { color: #a00; }
      button { margin-left: .5rem; }
      input { width: 100%; margin-top: .25rem; }
      small { color: #666; }
    </style>
    <script src="/gui/app.js"></script>
  </head>
  <body>
    <h1>FountainAI</h1>
    <p>Tell FountainAI what you need. It will read, analyze, and summarize sources for you — with citations.</p>

    <div class="card" style="max-width: 760px;">
      <h3>Ask FountainAI</h3>
      <form id="askForm" action="/gui/ask.html" method="get" class="row">
        <input name="q" id="q" placeholder="e.g., Summarize this article and give me 5 action items" style="flex:1" />
        <input name="url" id="u" placeholder="Optional: paste a link" style="flex:1" />
        <button type="submit">Go</button>
      </form>
      <small>Paste a link to include source content. FountainAI will analyze and cite it.</small>
    </div>

    <div style="margin-top: 2rem;">
      <small>Advanced users: corpus tools remain available — <a href="/gui/analyze.html">Analyze URL → Insight</a>, <a href="/gui/page.html">Page Detail</a>.</small>
    </div>
    <script>
      document.getElementById('askForm').onsubmit = (e) => {
        const f = e.target; if (!f.q.value && !f.url.value) { e.preventDefault(); alert('Please enter a question or a URL.'); }
      };
    </script>
  </body>
  </html>
