name: macOS App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build core
        run: swift build --target FountainAICore -c debug
      - name: Test core
        run: swift test --filter FountainAICoreTests --enable-code-coverage
      - name: Build app
        run: swift build --product FountainAIApp -c debug

